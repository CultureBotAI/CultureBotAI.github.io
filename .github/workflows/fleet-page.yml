name: Fleet page

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CultureBotAI/culturebotai-claw
          ref: main
          path: .claw
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/fleet/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/fleet/refresh_manifest.py --claw-root .claw --check
      - run: python scripts/fleet/assemble_page.py --check
